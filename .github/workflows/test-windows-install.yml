name: Test Windows Install

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install.ps1'
      - 'install.sh'
      - 'cmd/server/main.go'
      - '.github/workflows/test-windows-install.yml'

jobs:
  test-powershell:
    runs-on: windows-latest
    steps:
      - name: Install via PowerShell (irm | iex)
        shell: pwsh
        run: |
          irm https://dread.sh/install.ps1 | iex
      - name: Verify dread is on PATH
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","User") + ";" + [System.Environment]::GetEnvironmentVariable("Path","Machine")
          dread.exe --version

  test-cmd:
    runs-on: windows-latest
    steps:
      - name: Install via cmd.exe (powershell -c wrapper)
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -c "irm https://dread.sh/install.ps1 | iex"
      - name: Verify dread is on PATH
        shell: cmd
        run: |
          for /f "tokens=2*" %%a in ('reg query "HKCU\Environment" /v Path') do set "USER_PATH=%%b"
          set "PATH=%PATH%;%USER_PATH%"
          dread.exe --version
